services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pageless
      POSTGRES_PASSWORD: pageless
      POSTGRES_DB: pageless
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pageless"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
