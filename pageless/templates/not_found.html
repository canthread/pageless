{% extends "base.html" %}
{% block title %}Not found · {{ chrome.profile.name }}{% endblock %}
{% block main %}
<main id="page" class="pl-page is-done">
  <section class="c-hero">
    <h1>Nothing here</h1>
    <p>There's no page at <code>{{ path }}</code>. Try one of these:</p>
    <ul class="c-links">
    {% for r in chrome.nav %}<li><a href="{{ r.path }}">{{ r.title }}</a></li>{% endfor %}
    </ul>
  </section>
</main>
{% endblock %}
